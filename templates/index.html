<!DOCTYPE html>
<html>
<head>
    <title>Flask Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding-top: 80px;
        }

        .calculator {
            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        input, select, button {
            width: 90%;
            padding: 12px;
            margin: 8px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        .result {
            font-size: 22px;
            margin-top: 20px;
            color: green;
        }

        .error {
            color: red;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>Flask Calculator</h1>

    <form method="POST">

        <input
            type="number"
            step="any"
            name="num1"
            placeholder="First number"
            required
        >

        <input
            type="number"
            step="any"
            name="num2"
            placeholder="Second number"
            required
        >

        <select name="operation">
            <option value="add">Addition (+)</option>
            <option value="subtract">Subtraction (-)</option>
            <option value="multiply">Multiplication (×)</option>
            <option value="divide">Division (÷)</option>
        </select>

        <button type="submit">Calculate</button>

    </form>

    {% if result is not none %}
        <div class="result">
            Result: {{ result }}
        </div>
    {% endif %}

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

</div>

</body>
</html>
